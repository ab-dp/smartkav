<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#333;display:flex;gap:20px;padding:20px}.av{width:512px;height:512px}</style></head><body>
<!-- A · from the logo: the line rides into the circle; the dot is the agent, present -->
<svg id="A" class="av" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0B0D11"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(218,226,240,.12)" stroke-width="3"/>
  <line x1="64" y1="256" x2="184" y2="256" stroke="#FFB000" stroke-width="26" stroke-linecap="round"/>
  <circle cx="290" cy="256" r="92" fill="none" stroke="#FFB000" stroke-width="26"/>
  <circle cx="290" cy="256" r="26" fill="#F3F1EC"/>
</svg>
<!-- B · monogram: a hairline K inside the amber ring -->
<svg id="B" class="av" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0B0D11"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FFB000" stroke-width="14"/>
  <text x="256" y="262" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Sans Hebrew" font-weight="200" font-size="250" fill="#F3F1EC">K</text>
  <circle cx="352" cy="352" r="0" fill="#FFB000"/>
</svg>
<!-- C · the clock at 22:45, the moment everything is closed -->
<svg id="C" class="av" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0B0D11"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="rgba(218,226,240,.28)" stroke-width="5"/>
  <g stroke="rgba(243,241,236,.7)" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="84" x2="256" y2="112"/><line x1="428" y1="256" x2="400" y2="256"/><line x1="256" y1="428" x2="256" y2="400"/><line x1="84" y1="256" x2="112" y2="256"/>
  </g>
  <line x1="256" y1="256" x2="160" y2="256" stroke="#FFB000" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="208" y2="193" stroke="#F3F1EC" stroke-width="22" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="20" fill="#FFB000"/>
</svg>
</body></html>
