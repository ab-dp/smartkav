<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>SmartKav share image</title>
<!-- Source of og.jpg (1200×630). Render: open at 1200×630, screenshot, save as JPG (~100KB).
     Logo-led and centred (it survives WhatsApp's square crop). The night city is the film's first frame, held far back. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@200;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0B0D11}
.og{position:relative;width:1200px;height:630px;background:#0B0D11 url(../../film/poster.jpg) 30% 50%/cover no-repeat;color:#F3F1EC;font-family:"IBM Plex Sans Hebrew",sans-serif;display:grid;place-items:center}
.og::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 50%,rgba(11,13,17,.72) 0,rgba(11,13,17,.9) 70%,rgba(11,13,17,.96) 100%)}
.og::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(270deg,#FFB000,rgba(255,176,0,.15))}
.in{position:relative;z-index:1;text-align:center}
.mark{width:200px;height:87px;display:block;margin:0 auto 30px}
.mark line{stroke:#FFB000;stroke-width:5;stroke-linecap:round}.mark circle{fill:none;stroke:#FFB000;stroke-width:5}
.word{direction:ltr;font-weight:500;font-size:64px;letter-spacing:.005em;line-height:1}
.word span{font-weight:200}
.line{margin:30px 0 0;font-weight:200;font-size:34px;letter-spacing:-.01em;color:rgba(243,241,236,.86)}
.line b{font-weight:500;color:#F3F1EC}.line i{font-style:normal;color:#FFB000}
</style>
</head>
<body>
<div class="og">
  <div class="in">
    <svg class="mark" viewBox="0 0 92 40" aria-hidden="true"><line x1="6" y1="20" x2="62" y2="20"/><circle cx="74" cy="20" r="12"/></svg>
    <div class="word">Smart<span>Kav</span></div>
    <p class="line">כל ההסעות של השבוע. <b>בחמש דקות<i>.</i></b></p>
  </div>
</div>
</body>
</html>
